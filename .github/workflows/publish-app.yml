name: Publish Auto Setup

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: publish-app
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Build app ZIP
        shell: powershell
        run: |
          $archive = & .\Build-AppZip.ps1
          $zip = [IO.Compression.ZipFile]::OpenRead($archive.FullName)
          try {
            $reader = [IO.StreamReader]::new($zip.GetEntry('version.txt').Open())
            try { $version = $reader.ReadToEnd().Trim() } finally { $reader.Dispose() }
          } finally { $zip.Dispose() }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Publish GitHub release
        shell: pwsh
        run: |
          $headSha = gh api "repos/$env:GITHUB_REPOSITORY/commits/main" --jq .sha
          if ($LASTEXITCODE) { throw 'Could not read main' }
          if ($headSha -ne $env:GITHUB_SHA) { return }
          $tag = "app-$env:GITHUB_SHA"
          $existing = gh release list --limit 1 --json tagName --jq '.[0].tagName'
          if ($LASTEXITCODE) { throw 'Could not list releases' }
          if ($existing -eq $tag) { return }
          gh release create $tag dist/Warit-AutoSetup-App.zip --target $env:GITHUB_SHA --title $env:APP_VERSION --generate-notes --latest
          if ($LASTEXITCODE) { throw 'Could not publish app release' }
